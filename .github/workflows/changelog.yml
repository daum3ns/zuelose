name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce changelog update
        uses: dangoslen/changelog-enforcer@v3.7.0
        with:
          changeLogPath: CHANGELOG.md
          skipLabels: skip_changelog
          missingUpdateErrorMessage: >-
            Please add a CHANGELOG.md entry under [Unreleased],
            or apply the skip_changelog label.
